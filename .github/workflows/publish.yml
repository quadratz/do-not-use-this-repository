name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm install

      - name: Extract version and changelog content
        id: changelog
        run: node scripts/extract-changelog.ts

      - name: Get package name
        id: package
        run: echo "PACKAGE_NAME=$(jq -r .name package.json)" >> $GITHUB_OUTPUT

      - name: Determine if pre-release
        id: prerelease
        run: |
          if [[ "${{ steps.changelog.outputs.version }}" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        run: |
          if [ "${{ steps.prerelease.outputs.IS_PRERELEASE }}" == "true" ]; then
            npm publish --tag next
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to JSR
        run: npx jsr publish

      - name: Set newest tag
        run: npm dist-tag add ${{ steps.package.outputs.PACKAGE_NAME }}@${{ steps.changelog.outputs.version }} newest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Tag
        run: |
          git tag v${{ steps.changelog.outputs.version }}
          git push origin v${{ steps.changelog.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.changelog.outputs.version }}
          name: v${{ steps.changelog.outputs.version }}
          body: ${{ steps.changelog.outputs.content }}
          prerelease: ${{ steps.prerelease.outputs.IS_PRERELEASE }}
        # env:
        #   GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}